    openrefine-watchtower:
        image: containrrr/watchtower:1.4.0
        container_name: openrefine-watchtower
        profiles: ["openrefine-watchtower"]
        restart: unless-stopped
        networks:
         - default
        mem_limit: ${OPENREFINE_MEM_LIMIT}
        memswap_limit: ${OPENREFINE_MEMSWAP_LIMIT}
        cpus: ${OPENREFINE_CPU_LIMIT}
        volumes:
         - /var/run/docker.sock:/var/run/docker.sock
        environment:
            - WATCHTOWER_CLEANUP=true
            - WATCHTOWER_POLL_INTERVAL=60
            - WATCHTOWER_DEBUG=false
            - WATCHTOWER_NO_STARTUP_MESSAGE=true
            - WATCHTOWER_WARN_ON_HEAD_FAILURE=never
            - WATCHTOWER_RUN_ONCE=${OPENREFINE_WATCHTOWER_RUN_ONCE}
            - WATCHTOWER_SCOPE=openrefine-watchtower-scope
        labels:
            - "com.centurylinklabs.watchtower.scope=openrefine-watchtower-scope"
