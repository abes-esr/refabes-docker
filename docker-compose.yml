        profiles: ["reftheses"]
        mem_limit: ${OPENREFINE_THESES_MEM_LIMIT}
        cpus: ${OPENREFINE_THESES_CPU_LIMIT}
        volumes:
            - ./volumes/reftheses:/mnt/refine
            - ./refine.ini:/./openrefine/refine.ini
        ports:
