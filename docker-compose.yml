services:

    openrefine-alignements:
        container_name: refine-alignements
        image: abesesr/openrefine:${OPENREFINE_ALIGNEMENT_VERSION}
        profiles: ["refine-alignements"]
        mem_limit: ${OPENREFINE_ALIGNEMENT_MEM_LIMIT}
        cpus: ${OPENREFINE_ALIGNEMENT_CPU_LIMIT}
        volumes:
            - ./volumes/refine-alignements:/mnt/refine
            - ./refine.ini:/./openrefine/refine.ini
        ports:
            - "${OPENREFINE_ALIGNEMENT_PORT}:3333"
        restart: unless-stopped
        labels:
            # pour que les mises à jour de cette image soient auto-déployées par watchtower
            - "com.centurylinklabs.watchtower.scope=openrefine-watchtower-scope"

    openrefine-bacon:
        container_name: refbacon
        image: abesesr/openrefine:${OPENREFINE_BACON_VERSION}
        profiles: ["refbacon"]
        mem_limit: ${OPENREFINE_BACON_MEM_LIMIT}
        cpus: ${OPENREFINE_BACON_CPU_LIMIT}
        volumes:
            - ./volumes/refbacon:/mnt/refine
            #- ./refine.ini:/./openrefine/refine.ini
        ports:
            - "${OPENREFINE_BACON_PORT}:3333"
        #command: bash -c "sh /openrefine/refine -m ${REFINE_MEMORY}" 
        restart: unless-stopped
        labels:
            # pour que les mises à jour de cette image soient auto-déployées par watchtower
            - "com.centurylinklabs.watchtower.scope=openrefine-watchtower-scope"

