services:

    openrefine-alignements:
        image: abesesr/openrefine:develop
        profiles: ["refine-alignements"]
        mem_limit: ${OPENREFINE_MEM_LIMIT}
        memswap_limit: ${OPENREFINE_MEMSWAP_LIMIT}
        cpus: ${OPENREFINE_CPU_LIMIT}
        volumes:
            - ./volumes/refine-alignements:/mnt/refine
            - ./refine.ini:/./openrefine/refine.ini
        ports:
            - "13334:3333"
        restart: unless-stopped
        labels:
            # pour que les mises à jour de cette image soient auto-déployées par watchtower
            - "com.centurylinklabs.watchtower.scope=openrefine-watchtower-scope"

