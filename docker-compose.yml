services:

    openrefine-alignements:
        image: abes/openrefine376
        profiles: ["refine-alignements"]
        volumes:
            - ./volumes/refine-alignements:/mnt/refine
            - ./refine.ini:/./openrefine-$RELEASE/refine.ini
        ports:
            - "13334:3333"
        env_file:
            - openrefine.env
        restart: unless-stopped

